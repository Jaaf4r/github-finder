<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Search GitHub profiles and explore their latest public repositories." />
	<title>GitHub Profile Finder</title>
	<script type="module" src="./src/app.js"></script>
</head>

<body>
	<main class="app-shell">
		<h1>GitHub Profile Finder</h1>

		<p class="intro">
			Search for a GitHub user and explore their latest repositories.
		</p>

		<form id="profile-form" class="search-form">
			<label for="username">Username</label>
			<input id="username" name="username" type="text" placeholder="e.g. octocat" autocomplete="username"
				autocapitalize="none" spellcheck="false" required />
			<button id="search-button" type="submit">Find profile</button>
		</form>

		<p id="status" class="status-message" aria-live="polite"></p>

		<section id="profile" class="profile-card" hidden>
			<img id="avatar" alt="" />
			<h2 id="display-name"></h2>
			<p id="bio"></p>
			<p>Public repositories: <span id="repo-count"></span></p>

			<a id="profile-link" target="_blank" rel="noopener noreferrer">
				View profile on GitHub
			</a>

			<h3>Recent repositories</h3>
			<ul id="repo-list"></ul>
		</section>
	</main>
</body>

</html>
